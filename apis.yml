name: Kitch
description: >-
  Kitch was a Lisbon, Portugal based restaurant technology company founded in
  2019 by Rui Bento and Nuno Rodrigues, both former Uber executives for southern
  Europe. After starting as a delivery-first "dark kitchen" operator, Kitch
  pivoted during the 2020 pandemic into a SaaS platform that let restaurants
  consolidate and manage digital orders arriving from multiple third-party
  delivery marketplaces — Glovo, Uber Eats, Bolt Food and Just Eat among them —
  on a single tablet, alongside their own direct-ordering storefront, so
  operators could keep control of their menus, pricing and customer identity
  instead of depending on the aggregator apps. Kitch raised roughly EUR 1 million
  in pre-seed funding led by Seedcamp and Mustard Seed MAZE, followed by a EUR
  3.25 million seed round led by Atlantic Food Labs. The company was acquired by
  Barcelona-based delivery platform Glovo in a deal signed in January 2022 and
  announced in March 2022, and the standalone Kitch brand has since been retired.
  Kitch never published a public developer program: no developer portal, API
  reference, OpenAPI definition, SDK, or status page was ever published on
  kitch.io, and none appears in the Internet Archive's record of the domain. The
  kitch.io domain registration has since lapsed and now resolves to an unrelated
  third-party gambling site, so no live link is carried in this profile.
